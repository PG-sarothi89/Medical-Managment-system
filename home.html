<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#c42127">
  <title>CURO Medical Management System — Executive Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Frameworks & Typography: Plus Jakarta Sans & Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Production React & Motion Dashboard Styles -->
  <link rel="stylesheet" href="dist/dashboard.css">
  <link rel="stylesheet" href="home.css">
</head>

<body>

  <!-- React 18 + TypeScript + Motion Mount Target -->
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif;">
      <div style="text-align: center;">
        <img src="curo-logo.png" alt="CURO Medical" style="height: 52px; width: auto; margin-bottom: 16px; filter: drop-shadow(0 4px 8px rgba(196,33,39,0.15));">
        <div style="font-size: 14px; font-weight: 600; color: #1e293b; letter-spacing: -0.2px;">
          Initializing CURO Clinical Operations Dashboard...
        </div>
        <div style="font-size: 11px; color: #94a3b8; margin-top: 4px;">
          Loading React &bull; TypeScript &bull; Motion Telemetry
        </div>
      </div>
    </div>
  </div>

  <!-- Enterprise Data Layer -->
  <script src="aps-store.js"></script>
  <script src="aps-common.js"></script>

  <!-- React 18 + TypeScript + Framer Motion Application Bundle -->
  <script type="module" src="dist/dashboard.bundle.js"></script>

</html>

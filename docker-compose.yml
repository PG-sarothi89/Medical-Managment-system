version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curo-medical-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=curo_db
      - PGUSER=postgres
      - PGPASSWORD=curo_secure_password
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: curo-postgres
    restart: always
    environment:
      POSTGRES_DB: curo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: curo_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curo_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

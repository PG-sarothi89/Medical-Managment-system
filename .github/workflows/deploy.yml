name: 🚀 Deploy CURO Medical System to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ─── Build Job ────────────────────────────────────────────
  build:
    name: Build React Dashboard Bundle
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔨 Build React + TypeScript Dashboard
        run: npm run build

      - name: 🗂️ Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Static Site Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repo root (excluding node_modules via .gitignore)
          path: '.'

  # ─── Deploy Job ───────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
